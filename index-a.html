(function(){
  var q=location.search, ls=null;
  try{ ls=localStorage.getItem('lite'); }catch(e){}
  if(/[?&]lite=0/.test(q)){ try{localStorage.setItem('lite','0');}catch(e){} ls='0'; }
  if(/[?&]lite=1/.test(q)){ try{localStorage.setItem('lite','1');}catch(e){} ls='1'; }
  var ua=navigator.userAgent||'';
  var tv=/SMART-TV|SmartTV|Tizen|Web0S|WebOS|NetCast|BRAVIA|VIDAA|HbbTV|Hisense|Philips|AFT[A-Z]+|Android TV|GoogleTV|CrKey|AppleTV|Roku|TV Safari|\bTV\b/i.test(ua);
  window.LITE = ls==='1' || (ls!=='0' && tv);
  if(window.LITE) document.documentElement.classList.add('lite');
  // Barra lateral según el ÚLTIMO método de entrada usado (no depende del user agent ni del tamaño de pantalla):
  //   flechas -> barra a la izquierda | táctil/ratón -> barra abajo.
  // (?tv=1 / ?tv=0 siguen forzando activarla / desactivarla)
  window.isSideNav=function(){ return document.documentElement.classList.contains('sidenav'); };
  var d=document.documentElement;
  var forced = /[?&]tv=1/.test(q) ? 1 : /[?&]tv=0/.test(q) ? 0 : null;
  function setSide(on){
    if(forced!==null) on=!!forced;
    d.classList.toggle('sidenav',on);
    try{ localStorage.setItem('navmode', on?'keys':'pointer'); }catch(e){}
  }
  // Estado inicial: el último que se usó (así no parpadea al cargar)
  var saved=null; try{ saved=localStorage.getItem('navmode'); }catch(e){}
  d.classList.toggle('sidenav', forced!==null ? !!forced : saved==='keys');

  if(forced===null){
    var ARROWS={ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1,37:1,38:1,39:1,40:1};
    window.addEventListener('keydown',function(e){
      if(!(ARROWS[e.key]||ARROWS[e.keyCode])) return;
      var t=e.target;
      if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
      if(!window.isSideNav()) setSide(true);
    },true);
    var off=function(){ if(window.isSideNav()) setSide(false); };
    window.addEventListener('touchstart',off,{passive:true,capture:true});
    window.addEventListener('pointerdown',function(e){
      if(e.pointerType==='touch'||e.pointerType==='mouse'||e.pointerType==='pen') off();
    },true);
    window.addEventListener('mousemove',function(e){
      if(e.movementX||e.movementY) off();
    },true);
  }
})();
</script>

    </div><div id="status"><div class="spinner"></div></div><div id="searchContainer" style="display:none;width:95%;max-width:500px;margin:10px auto 0 auto;gap:8px;align-items:center;padding-bottom:10px;"><div style="position:relative;flex:1;display:flex;align-items:center"><input type="text" id="globalSearchInput" placeholder="Buscar canal, equipo o competición..." style="width:100%;padding:12px 40px 12px 16px;border-radius:12px;border:1px solid var(--border-color);background:var(--card-bg);color:#fff;font-size:.9rem;outline:0"><span id="clearSearch" style="position:absolute;right:12px;color:var(--text-muted);cursor:pointer;display:none;font-size:1.2rem;user-select:none">&times;</span></div></div><div id="events-container"></div>
<div id="noResultsContainer" style="display:none;text-align:center;padding:40px;color:var(--text-muted)"><div><div style="font-size:3rem;margin-bottom:10px;color:var(--accent-blue)" class="material-symbols-outlined">satellite_alt</div><div style="font-weight:700;font-size:1.1rem;color:var(--text-main)">Sin resultados</div><div style="font-size:.85rem;margin-top:5px;opacity:.8">Intenta con otra búsqueda</div></div></div><div id="ids-modal" class="modal-overlay" onclick="UIManager.closeModal(event)"><div class="modal-content" onclick="event.stopPropagation()"><div id="modal-title" class="modal-title">Canales</div><div id="ids-list" class="ids-list"></div></div></div><nav class="bottom-nav"><div class="nav-item active" id="nav-home" tabindex="0" role="button" onclick='UIManager.switchTab("home")'><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span><span>EVENTOS</span></div><div class="nav-item" id="nav-channels" tabindex="0" role="button" onclick='UIManager.switchTab("channels")'><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></span><span>CANALES</span></div></nav><script>const CONFIG = {
            BASE_URL: 'https://www.futbolenlatv.es',
            TARGET_URL: 'https://www.futbolenlatv.es/deporte',
            GIST_LOGOS: 'https://gist.githubusercontent.com/Ciento20/5580f05d8ecab2a3de797d7ef4365406/raw/',
            // Base de los logos de Movistar+: en el gist basta con poner el ID (MLIGA, DAZMOT.png...) y se completa sola
            MOVISTAR_LOGO_BASE: 'https://www.movistarplus.es/recorte/m-DP/canal/',
            EPG_XML: 'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml',
            // Plan B: gist que se rellena a mano. Sin el hash de revisión en la URL, siempre devuelve la última versión guardada.
            GIST_MANUAL: 'https://gist.githubusercontent.com/Ciento20/fcb8208326c94be2668f6aaaf914cd1c/raw/gistfile1.txt'
        };

        const STORAGE_CONFIG = {
            CACHE_KEY: 'ace_ids_cache',
            // Un hash que no aparece en NINGUNA fuente durante este tiempo se elimina por completo
            // (lista de enlaces, puntuación y ciclo de probados). Se identifica solo por el hash.
            LINK_TTL_MS: 15 * 24 * 60 * 60 * 1000, // 15 días
            SEEN_KEY: 'ace_hash_seen',              // hash -> última vez que apareció (en horas)
            SRC_OK_KEY: 'ace_source_ok',            // fuente -> última vez que respondió bien (en horas)
            SOURCE_DOWN_MS: 30 * 24 * 60 * 60 * 1000 // fuente sin responder 30 días: se deja de protegerla
        };        const RatingEngine = {
            DB_KEY: 'ace_autorating_v1',
            SESSION_KEY: 'ace_current_session',
            PENDING_KEY: 'ace_pending_penalties_list',
            interval: null,

            // Lectura robusta y cacheada: si el JSON guardado se corrompe, antes getScore()
            // lanzaba una excepción y el botón del canal dejaba de funcionar. Además se evita
            // re-parsear toda la base de datos en cada comparación del sort (exportación, listados).
            _dbRaw: null, _dbObj: null,
            getDB() {
                let raw = null;
                try { raw = localStorage.getItem(this.DB_KEY); } catch (e) {}
                if (raw !== null && raw === this._dbRaw && this._dbObj) return this._dbObj;
                let obj = {};
                try { obj = JSON.parse(raw) || {}; } catch (e) { obj = {}; }
                if (typeof obj !== 'object' || Array.isArray(obj)) obj = {};
                this._dbRaw = raw; this._dbObj = obj;
                return obj;
            },

            // Elimina las puntuaciones cuyo hash cumple el predicado (se usa en la limpieza de enlaces antiguos)
            pruneScores(shouldRemove) {
                const db = this.getDB();
                let n = 0;
                for (const k of Object.keys(db)) { if (shouldRemove(k.toLowerCase())) { delete db[k]; n++; } }
                if (n > 0) { try { localStorage.setItem(this.DB_KEY, JSON.stringify(db)); } catch (e) {} }
                return n;
            },

            getSession() {
                try { return JSON.parse(localStorage.getItem(this.SESSION_KEY)); } catch (e) { return null; }
            },

            // Se llama cuando la app pasa a segundo plano (p.ej. al abrir el reproductor externo).
            // Sirve para distinguir un "he vuelto a la app" real de un evento de foco espurio
            // justo al lanzar el enlace, que penalizaría por error un enlace que sí funciona.
            markLeftApp() {
                const session = this.getSession();
                if (session && !session.leftApp) {
                    session.leftApp = true;
                    try { localStorage.setItem(this.SESSION_KEY, JSON.stringify(session)); } catch (e) {}
                }
            },
            
            // Tabla de efectos (minutos que duró la sesión -> efecto en la puntuación)
            //   < 1 min .... -1.8
            //   1 a 15 min . -1.5
            //   15 a 25 min  -1.0
            //   25 a 30 min  -0.5
            //   cada 30 min viéndolo: +0.5 (máximo +1.5 por sesión)
            MAX_REWARD: 1.5,
            penaltyFor(min) {

            },            saveToCache(data, hashes = {}) {

            parseEra(text) {

                    const groupMatch = line.match(/group-title="([^"]*)"/);

            //  - JSON con el mismo formato que Elcano ({"hashes":[{title,hash}]}) o un array de {name/title, id/hash}
            //  - Lista M3U (#EXTINF + acestream://ID)

            parseManual(text) {

                    try {

                        .replace(idRe, ' '));

                        seen.add(id);

                    }
                }

            },
            // Limpieza específica de nombres de la lista AS: etiquetas [..]/(..), calidad, banderas, numeración, origen "-->"
            cleanAsName(raw) {

                n = n.replace(/\S*[a-z0-9-]\.(?:com|top|io|me|net|org|tv|link|xyz|app|cc|to|online|blog|site|live|club|info|biz|fun|pro)(?:[\/:?#]\S*)?(?=\s|$)/gi, ' '); // dominios sueltos: elcano.top, t.me/xxx

            termSrc(term) {
                let t = this.norm(term).trim();
                if (!t) return null;
                let end = false;
                if (t.endsWith('$')) { end = true; t = t.slice(0, -1).trim(); }
                if (!t) return null;
                const src = t.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\\\+/g, '\\s*(?:\\+|PLUS)')).join('\\s*');
                return '(?<![A-Z])' + src + (end ? '\\s*$' : '');
            },
            parse(lines) {
                const list = [];
                (lines || []).forEach(l => {
                    const m = String(l).match(/^@(grupo|etiqueta)\s*:\s*(\S+)\s*=\s*(.+)$/i);
                    if (!m) return;
                    const kind = m[1].toLowerCase() === 'etiqueta' ? 'e' : 'g';
                    const terms = m[3].split(',').map(t => this.termSrc(t)).filter(Boolean);
                    if (!terms.length) return;
                    let it = list.find(x => x.emoji === m[2] && x.kind === kind);
                    if (it) it.src.push(...terms); else list.push({ emoji: m[2], kind, src: terms });
                });
                return list.filter(it => { try { it.re = new RegExp(it.src.join('|')); return true; } catch (e) { return false; } });
            },
            set(lines) {
                this.list = this.parse(lines);
                const order = [];
                ['g', 'e'].forEach(k => this.list.forEach(it => { if (it.kind === k && !order.includes(it.emoji)) order.push(it.emoji); }));
                this.order = order;
            },
            load() {
                let lines = null;
                try { lines = JSON.parse(localStorage.getItem(this.CACHE_KEY)); } catch (e) {}
                this.set(Array.isArray(lines) ? lines : []);
            },
            saveFromGist(lines) {
                if (!lines || !lines.length) return false;
                try { localStorage.setItem(this.CACHE_KEY, JSON.stringify(lines)); } catch (e) {}
                this.set(lines);
                return true;
            },
            // Bandera (emoji) a la que pertenece un canal, o null. Las etiquetas se comprueban antes que los grupos.
            match(name) {
                const raw = this.norm(name), canon = getCanonicalName(name);
                for (const kind of ['e', 'g']) {
                    for (const it of this.list) {
                        if (it.kind === kind && (it.re.test(raw) || it.re.test(canon))) return it.emoji;
                    }
                }
                return null;
            }

            // ===== Subida al Gist (formato addon) =====

            addonName(v) { const upN = x=>x.toUpperCase().replace(/^(?:M\+|MOVISTAR\+?(?:\s+PLUS)?)$/,'MOVISTAR+ PLUS').replace(/^M\+\s*/,'MOVISTAR+ ').replace(/^MOVISTAR\s+PLUS\s+(?=\S)/,'MOVISTAR+ ').replace(/^MOVISTAR\s+(?!PLUS$)(?=\S)/,'MOVISTAR+ ').replace(/\s+/g,' ').trim().replace(/^MOVISTAR\+\s+(LIGA DE CAMPEONES\b)/,'$1'); return upN(String(v || '')); },
            // Nombre limpio sin etiquetas de calidad (HD, FHD, 4K, BAR...) para canales sin código de Movistar
            addonClean(v) { const cleanId = n=>String(n||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase()
  .replace(/(?<![A-Z0-9])(?:FULL ?HD|UHD|FHDP|HDP|SDP|FHD|HDR|HEVC|H ?26[45]|\d{2,3} ?FPS|4K|1080[PI]?|720P?|576P?|HD|SD|BAR|SOLO EVENTOS)(?![A-Z0-9])/g,' ')
  .replace(/[\(\[\{]\s*[\)\]\}]/g,' ')
  .replace(/[^A-Z0-9+ ]+/g,' ')
  .replace(/\s+/g,' ').trim(); return cleanId(v); },
            // Código de Movistar+ sacado del logo (.../canal/M1SD.png -> m1sd)
            addonCode(logo) {

            // Lista para el addon: tvg-id = movistar-plus:<código> (o nombre limpio), nombre/grupo en mayúsculas y el mismo id y nombre en todos los enlaces de un canal

        /* --- MODO AMBIENTE (Ambilight) ---
           Réplica exacta de la técnica de referencia: un <canvas> de baja resolución
           (192 de ancho, alto según el aspecto REAL del contenedor) detrás del vídeo,
           escalado y con blur CSS. En cada fotograma se calcula el recuadro exacto que
           ocupa el vídeo real dentro del contenedor (mismo cálculo que object-fit:contain)
           y se pinta ahí sin distorsión; después se estira el borde exterior real del
           vídeo hacia las franjas de letterbox, para que el color case con el borde.
           Clave: el <video> tiene background:transparent (no negro), así el hueco de
           letterbox de object-fit:contain deja ver el canvas que está detrás. */
        const Ambilight = {
            video: null,
            canvas: null,
            ctx: null,
            container: null,
            viewport: null,
            rafId: null,
            lastDraw: 0,
            W: 96,
            FRAME_MS: 66, // ~15fps
            _loggedError: false,
            // Gamma < 1: sube los tonos oscuros/medios de forma proporcional real,
            // dejando el negro puro (0) y el blanco puro (255) exactamente igual.
            // Es una curva sobre el propio valor del píxel, no un filtro superpuesto.
            GAMMA: 0.82,
            _lut: null,

            _buildLut() {
                const lut = new Uint8ClampedArray(256);
                for (let i = 0; i < 256; i++) {
                    lut[i] = 255 * Math.pow(i / 255, this.GAMMA);
                }
                this._lut = lut;
            },

            init(video, canvas, container, viewport) {
                this.destroy(); // por si quedaba una instancia previa colgada
                if (window.LITE) { this.video = video; this.canvas = canvas; this.container = container; this.viewport = viewport || container; return; }
                this._loggedError = false;

                this.video = video;
                this.canvas = canvas;
                this.container = container;
                this.viewport = viewport || container;

                this._onPlaying = () => this.start();
                this._onStop = () => this.stop();
                this._onResize = () => this.resizeCanvas();
                this._onFsChange = () => setTimeout(() => this.resizeCanvas(), 50);

                video.addEventListener('play', this._onPlaying);
                video.addEventListener('playing', this._onPlaying);
                video.addEventListener('pause', this._onStop);
                video.addEventListener('ended', this._onStop);
                video.addEventListener('emptied', this._onStop);

                window.addEventListener('resize', this._onResize);
                window.addEventListener('orientationchange', this._onResize);
                document.addEventListener('fullscreenchange', this._onFsChange);
                document.addEventListener('webkitfullscreenchange', this._onFsChange);

                this.resizeCanvas();
            },

            isFullscreen() {
                const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
                return !!fsEl && fsEl === this.container;
            },

            // La resolución interna del canvas sigue la relación de aspecto REAL que ocupa
            // el contenedor en pantalla (no siempre 16:9): en fullscreen puede ser cualquier
            // aspecto (p.ej. un móvil en vertical). Si no igualamos esa relación, el canvas
            // se estiraría de forma distinta en horizontal y vertical, deformando el color.
            resizeCanvas() {
                if (!this.canvas || !this.viewport) return;
                const rect = this.viewport.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const aspect = rect.width / rect.height;
                const newW = this.W;
                const newH = Math.max(1, Math.round(this.W / aspect));
                if (this.canvas.width !== newW || this.canvas.height !== newH) {
                    this.canvas.width = newW;
                    this.canvas.height = newH;
                }
            },

            _barsState: null, // null | 'h' | 'v' | 'none'

            _updateBarsOrientation(dx, dy) {
                if (!this.viewport) return;
                const TOL = 0.5; // px de tolerancia para evitar parpadeo por redondeo
                let state;
                if (dy > TOL) state = 'h';
                else if (dx > TOL) state = 'v';
                else state = 'none';
                if (state === this._barsState) return;
                this._barsState = state;
                this.viewport.classList.toggle('ambilight-bars-h', state === 'h');
                this.viewport.classList.toggle('ambilight-bars-v', state === 'v');
            },

            loop(ts) {
                if (!this.video || !this.canvas || this.video.paused || this.video.ended) {
                    this.stop();
                    return;
                }
                if (!this.lastDraw || (ts - this.lastDraw) >= this.FRAME_MS) {
                    this.lastDraw = ts;
                    this.draw();
                }
                this.rafId = requestAnimationFrame((t) => this.loop(t));
            },

            draw() {
                try {
                    if (!this.ctx) this.ctx = this.canvas.getContext('2d', { alpha: false });
                    const cw = this.canvas.width, ch = this.canvas.height;
                    const vw = this.video.videoWidth, vh = this.video.videoHeight;
                    if (vw && vh) {
                        // Recuadro exacto que ocupa el vídeo real dentro del contenedor
                        // (mismo cálculo que hace object-fit:contain), para no estirar el
                        // fotograma entero sobre todo el canvas.
                        const containerAspect = cw / ch;
                        const videoAspect = vw / vh;
                        let dw, dh, dx, dy;
                        if (videoAspect > containerAspect) {
                            dw = cw; dh = cw / videoAspect;
                            dx = 0; dy = (ch - dh) / 2;
                        } else {
                            dh = ch; dw = ch * videoAspect;
                            dy = 0; dx = (cw - dw) / 2;
                        }
                        // Marca en el contenedor en qué par de lados hay franja de
                        // letterbox real (dy>0 = arriba/abajo, dx>0 = izquierda/derecha),
                        // para que el sombreado CSS solo aparezca en esos 2 lados.
                        this._updateBarsOrientation(dx, dy);
                        // 1) Fotograma real, sin distorsión, en su recuadro exacto.
                        this.ctx.drawImage(this.video, dx, dy, dw, dh);
                        // 2) Estiramos el borde exterior REAL del vídeo hacia las franjas,
                        //    para que el color que toca el vídeo sea siempre el de su propio
                        //    borde (da continuidad en vez de mostrar un recorte interior).
                        // La franja de origen (EXT) SIEMPRE debe ser igual o más ancha que la
                        // franja de destino (dx/dy en el canvas), para que drawImage haga una
                        // REDUCCIÓN real (promedio de muchos píxeles) y no una AMPLIACIÓN.
                        // Si la franja de origen es más estrecha que el hueco a rellenar, el
                        // navegador se limita a estirar esos pocos píxeles: si justo caen sobre
                        // un marcador, logo o línea de campo brillante, ese único tono se
                        // convierte en el 100% del color de toda la franja oscura de alrededor
                        // ("el brillo invade la oscuridad"). Multiplicamos por 3 el hueco a
                        // rellenar para garantizar un promedio real de varios píxeles por cada
                        // píxel de destino, diluyendo cualquier elemento puntual brillante.
                        const EXT = Math.min(
                            Math.round(vw * 0.15),
                            Math.max(2, Math.round(vw * 0.005), Math.ceil(dx * 3))
                        );
                        const EXT_V = Math.min(
                            Math.round(vh * 0.15),
                            Math.max(2, Math.round(vh * 0.005), Math.ceil(dy * 3))
                        );
                        if (dx > 0) {
                            this.ctx.drawImage(this.video, 0, 0, EXT, vh, 0, dy, dx, dh);
                            this.ctx.drawImage(this.video, vw - EXT, 0, EXT, vh, dx + dw, dy, cw - (dx + dw), dh);
                        }
                        if (dy > 0) {
                            this.ctx.drawImage(this.video, 0, 0, vw, EXT_V, dx, 0, dw, dy);
                            this.ctx.drawImage(this.video, 0, vh - EXT_V, vw, EXT_V, dx, dy + dh, dw, ch - (dy + dh));
                        }
                    } else {
